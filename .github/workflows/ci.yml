name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./gunne/package-lock.json

      - name: Install dependencies
        working-directory: ./gunne
        run: npm ci

      - name: Wait for MongoDB
        run: |
          timeout 30 bash -c 'until mongosh --host localhost:27017 --eval "db.adminCommand(\"ping\")" --quiet; do sleep 1; done'

      - name: Run linter
        working-directory: ./gunne
        run: npm run lint

      - name: Build
        working-directory: ./gunne
        run: npm run build

      - name: Run tests
        working-directory: ./gunne
        run: npm run test
        env:
          MONGO_URI: mongodb://localhost:27017/test
