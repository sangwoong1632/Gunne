

services:
  # 1. 몽고디비 서비스
  mongo:
    image: mongo:latest
    container_name: nest_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      # DB 데이터를 내 컴퓨터에도 저장 (컨테이너가 꺼져도 데이터 유지)
      - ./mongo-data:/data/db

  redis:
    image: redis:latest
    container_name: nest_redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes # 데이터 영구 저장 옵션 켜기

